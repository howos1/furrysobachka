<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link type="image/png" sizes="512x511" rel="icon" href="https://meow.furrysobachka.ru/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style-gallery.css">
  <script src="https://meow.furrysobachka.ru/osu-cursor/dist/index.cjs.js"></script>
  <meta name="description" content="About furry uwu nyawka, with nickname howosy">
  <title>YukiMeow Arts</title>
</head>
<body>
  <div class="container">
    <h1>YukiMeow Arts :3</h1>
    <div class="gallery" id="gallery"></div>
    <div class="loading" id="loading">Загрузка...</div>
  </div>

  <div class="fullscreen-overlay" id="fullscreenOverlay">
    <button class="close-button" id="closeButton">
      <i class="fas fa-times"></i>
    </button>
    
    <button class="nav-button prev-button" id="prevButton">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button class="nav-button next-button" id="nextButton">
      <i class="fas fa-chevron-right"></i>
    </button>

    <img class="fullscreen-image" id="fullscreenImage" src="" alt="">
    <video class="fullscreen-image" id="fullscreenVideo" autoplay loop muted playsinline style="display: none;"></video>
    <div class="fullscreen-author-container" id="fullscreenAuthorContainer">
      <div class="fullscreen-author" id="fullscreenAuthor"></div>
      <div class="fullscreen-femboy" id="fullscreenFemboy">(Femboy Version)</div>
    </div>
  </div>

  <a href="/" class="back-button">
    <i class="fas fa-arrow-left"></i> Назад
  </a>

  <div class="nsfw-toggle">
    <label class="switch">
      <input type="checkbox" id="nsfwCheckbox">
      <span class="slider"></span>
    </label>
    <span class="nsfw-label">NSFW</span>
  </div>

  <script>
    let allImages = [];
    let loadedCount = 0;
    const batchSize = 9;
    let isLoading = false;
    let currentFullscreenIndex = 0;
    let nsfwEnabled = false;

    const nsfwCheckbox = document.getElementById('nsfwCheckbox');
    const fullscreenOverlay = document.getElementById("fullscreenOverlay");
    const fullscreenImage = document.getElementById("fullscreenImage");
    const fullscreenVideo = document.getElementById("fullscreenVideo");
    const fullscreenAuthor = document.getElementById("fullscreenAuthor");
    const fullscreenFemboy = document.getElementById("fullscreenFemboy");
    const closeButton = document.getElementById("closeButton");
    const nextButton = document.getElementById("nextButton");
    const prevButton = document.getElementById("prevButton");

    function isVideoUrl(url) {
      return typeof url === "string" && /\.mp4(\?|#|$)/i.test(url);
    }

    function getActiveFullscreenMedia() {
      const item = allImages[currentFullscreenIndex];
      return item && isVideoUrl(item.url) ? fullscreenVideo : fullscreenImage;
    }

    async function loadGallery() {
      try {
        const response = await fetch("../dist/yukimeow.json");
        allImages = await response.json();
        
        loadNextBatch();
        
        window.addEventListener('scroll', handleScroll);
        
      } catch (err) {
        console.error("Ошибка загрузки галереи:", err);
        document.getElementById("gallery").innerHTML = "<p>Не удалось загрузить рисунки :(</p>";
        document.getElementById("loading").style.display = 'none';
      }
    }

    function handleScroll() {
      if (isLoading) return;
      
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const windowHeight = window.innerHeight;
      const documentHeight = document.documentElement.scrollHeight;
      
      if (scrollTop + windowHeight >= documentHeight - windowHeight * 0.2) {
        loadNextBatch();
      }
    }

    function applyNSFW(state) {
      nsfwEnabled = state;
      localStorage.setItem('nsfwEnabled', state ? 'true' : 'false');

      document.querySelectorAll('img[data-blur="true"], video[data-blur="true"]').forEach(media => {
        if (state) {
          media.classList.remove('nsfw-blurred');
        } else {
          media.classList.add('nsfw-blurred');
        }
      });

      if (fullscreenOverlay.classList.contains('active')) {
        const item = allImages[currentFullscreenIndex];
        const activeMedia = getActiveFullscreenMedia();
        if (item && item.blur) {
          if (state) {
            activeMedia.classList.remove('nsfw-blurred');
          } else {
            activeMedia.classList.add('nsfw-blurred');
          }
        } else {
          fullscreenImage.classList.remove('nsfw-blurred');
          fullscreenVideo.classList.remove('nsfw-blurred');
        }
      }
    }

    function loadNextBatch() {
      if (loadedCount >= allImages.length) {
        document.getElementById("loading").style.display = 'none';
        window.removeEventListener('scroll', handleScroll);
        return;
      }

      isLoading = true;
      const gallery = document.getElementById("gallery");
      const loadingElement = document.getElementById("loading");
      
      const nextBatch = allImages.slice(loadedCount, loadedCount + batchSize);
      const currentBatchStart = loadedCount;
      
      nextBatch.forEach((item, index) => {
        const absoluteIndex = currentBatchStart + index;

        setTimeout(() => {
          const div = document.createElement("div");
          div.className = "gallery-item";
          div.style.animationDelay = `${index * 0.1}s`;

          const wrapper = document.createElement("div");
          wrapper.className = "image-wrapper";

          const isVideo = isVideoUrl(item.url);
          const media = document.createElement(isVideo ? "video" : "img");
          media.src = item.url;

          if (isVideo) {
            media.autoplay = true;
            media.loop = true;
            media.muted = true;
            media.playsInline = true;
            media.setAttribute("playsinline", "");
            media.preload = "metadata";
          } else {
            media.alt = `Рисунок от ${item.author}`;
            media.loading = "lazy";
          }

          if (item.blur) {
            media.dataset.blur = "true";
            if (!nsfwEnabled) {
              media.classList.add('nsfw-blurred');
            }
          }

          media.addEventListener("click", () => {
            openFullscreen(absoluteIndex);
          });

          const overlay = document.createElement("div");
          overlay.className = "author-overlay";
          overlay.textContent = `Автор: ${item.author}`;

          wrapper.appendChild(media);
          wrapper.appendChild(overlay);
          div.appendChild(wrapper);
          gallery.appendChild(div);
        }, index * 50);
      });

      loadedCount += nextBatch.length;
      
      if (loadedCount < allImages.length) {
        loadingElement.textContent = `Загружено ${loadedCount} из ${allImages.length} рисунков...`;
      } else {
        loadingElement.textContent = `Все рисунки загружены! (${allImages.length})`;
        setTimeout(() => {
          loadingElement.style.display = 'none';
        }, 2000);
      }
      
      isLoading = false;
    }

    function resetElementsOpacity() {
      const elements = [fullscreenImage, fullscreenVideo, fullscreenAuthor, fullscreenFemboy];
      elements.forEach(el => {
        el.style.transition = '';
        el.classList.remove('fade-in');
        el.style.opacity = '';
      });
    }

    function renderFullscreenMedia(item) {
      const isVideo = isVideoUrl(item.url);
      fullscreenImage.classList.remove('nsfw-blurred');
      fullscreenVideo.classList.remove('nsfw-blurred');

      if (isVideo) {
        fullscreenImage.style.display = 'none';
        fullscreenImage.removeAttribute('src');
        fullscreenVideo.style.display = 'block';
        fullscreenVideo.src = item.url;
        fullscreenVideo.muted = true;
        fullscreenVideo.loop = true;
        fullscreenVideo.playsInline = true;
        fullscreenVideo.play().catch(() => {});

        if (item.blur && !nsfwEnabled) {
          fullscreenVideo.classList.add('nsfw-blurred');
        }
        return fullscreenVideo;
      } else {
        fullscreenVideo.pause();
        fullscreenVideo.style.display = 'none';
        fullscreenVideo.removeAttribute('src');
        fullscreenImage.style.display = 'block';
        fullscreenImage.src = item.url;

        if (item.blur && !nsfwEnabled) {
          fullscreenImage.classList.add('nsfw-blurred');
        }
        return fullscreenImage;
      }
    }

    function openFullscreen(index, isSwitching = false) {
      currentFullscreenIndex = index;
      const item = allImages[index];

      const activeMedia = renderFullscreenMedia(item);
      const animatedElements = [activeMedia, fullscreenAuthor, fullscreenFemboy];

      fullscreenAuthor.textContent = `Автор: ${item.author}`;
      fullscreenFemboy.style.display = item.femboy ? 'block' : 'none';

      if (isSwitching) {
        animatedElements.forEach(el => {
          el.style.transition = 'none';
          el.style.opacity = '0';
          el.classList.remove('fade-in');
        });

        requestAnimationFrame(() => {
          animatedElements.forEach(el => {
            el.style.transition = '';
            el.classList.add('fade-in');
          });
        });
      } else {
        resetElementsOpacity();
        fullscreenOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';
        
        setTimeout(() => {
          animatedElements.forEach(el => {
            el.classList.add('fade-in');
          });
        }, 50);
      }
    }

    function closeFullscreen() {
      const activeMedia = getActiveFullscreenMedia();
      const animatedElements = [activeMedia, fullscreenAuthor, fullscreenFemboy];
      animatedElements.forEach(el => {
        el.classList.remove('fade-in');
      });
      
      fullscreenOverlay.classList.add('closing');
      setTimeout(() => {
        fullscreenVideo.pause();
        fullscreenOverlay.classList.remove('active', 'closing');
        document.body.style.overflow = 'auto';
        [fullscreenImage, fullscreenVideo, fullscreenAuthor, fullscreenFemboy].forEach(el => {
          el.style.opacity = '';
        });
      }, 400);
    }

    function showNextImage(e) {
      if (e) e.stopPropagation();
      let nextIndex = currentFullscreenIndex + 1;
      if (nextIndex >= allImages.length) {
        nextIndex = 0;
      }
      openFullscreen(nextIndex, true);
    }

    function showPrevImage(e) {
      if (e) e.stopPropagation();
      let prevIndex = currentFullscreenIndex - 1;
      if (prevIndex < 0) {
        prevIndex = allImages.length - 1;
      }
      openFullscreen(prevIndex, true);
    }

    closeButton.addEventListener("click", closeFullscreen);
    nextButton.addEventListener("click", showNextImage);
    prevButton.addEventListener("click", showPrevImage);

    fullscreenOverlay.addEventListener("click", (e) => {
      if (e.target === fullscreenOverlay) {
        closeFullscreen();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (!fullscreenOverlay.classList.contains('active')) return;

      if (e.key === 'Escape') {
        closeFullscreen();
      } else if (e.key === 'ArrowRight') {
        showNextImage();
      } else if (e.key === 'ArrowLeft') {
        showPrevImage();
      }
    });

    const saved = localStorage.getItem('nsfwEnabled');
    if (saved === 'true') {
      nsfwCheckbox.checked = true;
      applyNSFW(true);
    } else {
      nsfwCheckbox.checked = false;
      applyNSFW(false);
    }

    nsfwCheckbox.addEventListener('change', function() {
      applyNSFW(this.checked);
    });

    loadGallery();
  </script>

<style>
  * {
      cursor: none !important;
  }
  .osu-cursor {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
  }

  @media (hover: none), (pointer: coarse) {
    * {
      cursor: none !important;
    }
    .osu-cursor {
      display: none !important;
    }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const cursor = new osuCursor({
      rotate: true,
      size: 1.0
    });
  });
</script>
</body>
</html>
